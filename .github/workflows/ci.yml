name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --exact --locked: fail if uv.lock is stale rather than silently
      # resolving something different from what the author tested.
      - name: Install project
        run: uv sync --all-groups --exact --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # The architectural invariant: no solver library outside model/.
      - name: Import boundary
        run: uv run lint-imports

      # Every document carries a generated index; a renamed section breaks
      # its own anchor silently, so staleness is a CI failure. The private
      # notes are gitignored and the tool skips whatever is not present.
      - name: Document indexes
        run: uv run python tools/toc.py --check README.md CLAUDE.md docs/DECISIONS.md data/README.md hpc/README.md

      - name: Tests
        run: uv run pytest -q
