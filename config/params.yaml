# Values and their justification: docs/DECISIONS.md §3 (asset, degradation,
# tariffs) and §6 (stack). Sections for the horizon protocol, the data
# snapshot and the forecaster arrive with the slices that read them

# --- Asset -----------------------------------------------------------------
# 10 MW / 20 MWh, 2-hour duration, grid-connected, standalone.
battery:
  p_max_mw: 10.0            # AC at the connection point, symmetric
  e_max_mwh: 20.0           # usable energy, not nameplate
  eta_rt: 0.85              # AC-to-AC round trip; split symmetrically as sqrt
  c_deg_eur_mwh: 17.0       # charged on discharged throughput only
  charge_tariff_eur_mwh: 0.0  # CNMC Circular 3/2020, see DECISIONS.md §3.4

# --- Sensitivity -----------------------------------------------------------
# c_deg is not an accounting parameter: a linear throughput cost is
# algebraically a minimum-spread threshold, so this is what sets cycles per
# year. Published values span nearly an order of magnitude, hence a
# three-point sweep rather than one defended number.
sensitivity:
  c_deg_eur_mwh: [5.0, 17.0, 40.0]

# --- Data ------------------------------------------------------------------
# The frozen snapshot. Downloaded once; after the snapshot commit the
# download code is not modified (invariant 6). Indicator IDs were verified
# against the live ESIOS catalogue on 24 August 2026 — see data/README.md for
# the evidence, including why the D+1 forecast family is the only one usable
# under invariant 1.
data:
  directory: data
  snapshot_date: 2026-08-24

  # Two regimes because the market changed under us: SDAC moved to 15-minute
  # market time units for delivery day 1 October 2025. Neither dt_h nor the
  # boundary is hardcoded anywhere in the code.
  regimes:
    hourly:
      dt_h: 1.0
      first_day: 2022-01-01
      last_day: 2025-09-30
    quarter_hourly:
      dt_h: 0.25
      first_day: 2025-10-01
      last_day: 2026-08-23

  series:
    # geo_id 3 is España. Indicator 600 carries six geographies and returns
    # them interleaved on the same timestamps with Portugal first, so this
    # key is load-bearing: without it the Portuguese price gets stored as the
    # Spanish one. They agree on most days — 36 of 744 periods differed in
    # January 2024, by up to €39/MWh — which is exactly what makes the
    # mistake survive a casual look.
    price_eur_mwh:
      indicator: 600
      geo_id: 3

    # The "Previsión diaria D+1" family: one publication per day covering
    # D+1, which is the information a bidder holds at 12:00 on D-1. The
    # rolling alternatives (541 wind, 542 PV, 460 demand) are revised
    # intraday and ESIOS serves the latest revision, so a historical pull of
    # those returns post-gate information. Measured over March 2024 against
    # realised generation: rolling 541 scores RMSE 896 MW against D+1 1777's
    # 2043 MW. A day-ahead forecast cannot be 2.3x better than a day-ahead
    # forecast; the difference is lookahead. geo_id 8741 is "Península".
    demand_forecast_mw:
      indicator: 1775
      geo_id: 8741
    wind_forecast_mw:
      indicator: 1777
      geo_id: 8741
    solar_forecast_mw:
      indicator: 1779
      geo_id: 8741

  # Independent validation against the market operator's own files. One
  # month is the stated minimum; June 2024 sits inside the hourly regime
  # where marginalpdbc has its classic layout.
  crosscheck:
    first_day: 2024-06-01
    last_day: 2024-06-30
    tolerance_eur_mwh: 0.01

# --- Horizon protocol ------------------------------------------------------
# DECISIONS.md §2.1 and §2.6. Expressed in *delivery days*, not in hours,
# because a delivery day is not always 24 hours long: §2.1's "48-hour window,
# first 24 implemented" means "solve D and D+1, commit D", which is 47 hours
# around the March transition and 49 around the October one. Writing 48 here
# would be invariant 4's failure in the one place it is least visible.
horizon:
  window_days: 2            # solved horizon: D plus D+1
  implement_days: 1         # committed and settled: D only
  warmup_days: 7            # simulated, then excluded from every metric
  soc_initial_fraction: 0.5 # 10 MWh, the arbitrary state the warm-up removes

# --- Perfect-foresight bound ----------------------------------------------
# The §2.4 annual-window solve: the same optimiser over a whole year with SoC
# free across days, to separate the value of horizon from the value of
# information. Reported twice — portable on HiGHS with the tolerance below,
# reference on a cluster with a commercial solver. See hpc/README.md.
bound:
  annual:
    # A whole calendar year inside the hourly regime, so the annual solve and
    # the rolling oracle it is compared against cover exactly the same days.
    first_day: 2024-01-01
    last_day: 2024-12-31
    # ~35,000 variables and 8,760 binaries. An exact gap is not affordable
    # here, unlike on a window solve; the tolerance is stated rather than
    # inherited so the published number carries the slack it was found with.
    mip_gap: 0.001
    time_limit_s: 3600.0

# --- Point forecaster ------------------------------------------------------
# LightGBM, deliberately boring: DECISIONS.md §7 puts the contribution in the
# decision layer, not here. Two stages — an hourly *level* model over the
# whole history, and an intra-hour *deviation* model over the period where
# that quantity is not identically zero. The second is built only when the
# regime's grid is finer than the published series; on the hourly regime it
# would be fitting a column of zeros. See src/bess_arb/forecast/lgbm.py for
# the four arms that were measured before settling on this.
forecast:
  # Delivery-day lags of the price, keyed on local time of day. They start at
  # two because the gate is noon on D-1, so D-1 has not finished: D-2 is the
  # most recent *complete* day. Asking for 1 here is refused in code — it is
  # the classic lookahead bug in this project, not a tuning choice.
  lags_days: [2, 3, 4, 5, 6, 7, 8]

  # Refit cadence in delivery days. Every fit is causal whatever this is; the
  # number buys wall clock at the price of staleness, and stating it means the
  # staleness is bounded by a config value rather than by convenience.
  refit_days: 30

  # History required behind the gate before the forecaster will answer at all.
  # A year, so every month of seasonality is represented once. Below it the
  # policy falls back to the floor's climatological vector and says so — see
  # DECISIONS.md §2.5 on why a young policy is reported rather than argued
  # about. In the headline quarter-hourly regime this never fires: its first
  # decision day has 3.7 years of price history behind it.
  min_train_days: 365
  # The deviation stage needs far less, because its target is mean-zero and
  # only exists after 1 October 2025.
  min_deviation_days: 30

  # v2.5, the bid-curve extension: the forecast policy's quantile belief is
  # the point forecast shifted by the tau-quantile of its own causal forecast
  # errors, bucketed by local time of day. This is the trust threshold on that residual
  # sample, the same role min_train_days plays for the level stage: below it
  # the quantile forecast declines, same as the point forecast does below
  # min_train_days.
  min_residual_obs: 30

  # Boosting rounds are a *ceiling*, not the number fitted. Each fit holds out
  # the most recent `validation_days` of its own trainable rows and stops when
  # the validation loss has not improved for `early_stopping_rounds`. Measured
  # over six cutoffs from 2024-01-01 to 2026-02-01, the level stage's chosen
  # count ranged 56-157 against the 600 that used to be fitted unconditionally:
  # the old value was some four times past the optimum, which cost both
  # accuracy and time. It varies threefold across cutoffs, which is why this is
  # decided per fit rather than written here as a constant.
  #
  # The ceilings stay generous so they never bind in practice; if a fit ever
  # reaches one, the diagnostics say so and the ceiling is the thing to raise.
  level_rounds: 600
  deviation_rounds: 400

  # The validation fold is the last `validation_days` of the rows already
  # admitted by `trainable_before`, so it is behind the gate like every other
  # row and adds no lookahead surface. It has to be the most *recent* stretch
  # to proxy the horizon at all; that it is also the most informative stretch
  # is the cost, and it is why a fit whose history cannot spare the fold falls
  # back to the ceiling instead of training on a stub.
  validation_days: 60
  early_stopping_rounds: 50

  threads: 4                # pinned: LightGBM is thread-count dependent

  # Passed to LightGBM as given. seed, deterministic and force_row_wise are
  # set in code so that reproducibility is not one YAML edit away from being
  # lost (invariant 8).
  level:
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 40
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 1
    lambda_l2: 1.0
  deviation:
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 60
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 1
    lambda_l2: 1.0

# --- Modelling stack -------------------------------------------------------
backend: pyomo              # pyomo | poi (the port, when it exists)

solver:
  name: highs
  # Window solves are small, so an exact gap is affordable and keeps the
  # golden test's 1e-6 tolerance meaningful — HiGHS's 1e-4 default would be
  # €0.15 of slop on a €1,500 optimum. The annual bound solve gets its own,
  # looser tolerance, stated explicitly where it is run.
  mip_gap: 0.0
  time_limit_s: 300.0
  threads: 1                # one thread: reproducible, and these are small
  options: {}               # passed straight through to the solver

# --- Reproducibility -------------------------------------------------------
seed: 20260819
